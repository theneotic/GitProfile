<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="hud-qnr8x3w" width="850" height="310" viewBox="0 0 850 310" role="img" aria-label="theneotic Cybercore HUD Card">
  <style>
    #hud-qnr8x3w {
      font-family: "Share Tech Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
      background: #040d07;
    }
    @keyframes radar-sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse-signal {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }
    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }
    .hud-radar-sweep {
      transform-origin: 85px 85px;
      animation: radar-sweep 8s linear infinite;
    }
    .hud-signal-pulse {
      animation: pulse-signal 3s ease-in-out infinite;
    }
    .hud-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      fill: #227040;
      text-transform: uppercase;
    }
    .hud-val {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.05em;
      fill: #e6fffa;
    }
  </style>

  <defs>
    <!-- Card Chamfered Clip Mask -->
    <clipPath id="hud-qnr8x3w-panel-clip">
      <polygon points="
        0 24,
        24 0,
        826 0,
        850 24,
        850 286,
        826 310,
        24 310,
        0 286
      " />
    </clipPath>

    <!-- Avatar Hexagonal Clip Mask -->
    <clipPath id="hud-qnr8x3w-hex-clip">
      <polygon points="50 14, 86 35, 86 77, 50 98, 14 77, 14 35" />
    </clipPath>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="hud-qnr8x3w-radar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#39ff14" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="hud-qnr8x3w-cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline Background Pattern -->
    <pattern id="hud-qnr8x3w-scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(255,255,255,0.018)" stroke-width="1" />
    </pattern>

    <!-- Dot Grid Pattern -->
    <pattern id="hud-qnr8x3w-dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="rgba(57, 255, 20, 0.08)" />
    </pattern>
  </defs>

  <!-- BACKGROUND BASE PANEL (Chamfered Corner Box) -->
  <g clip-path="url(#hud-qnr8x3w-panel-clip)">
    <!-- Deep Surface Fill -->
    <rect width="850" height="310" fill="#040d07" />
    <rect width="850" height="310" fill="rgba(5, 25, 12, 0.85)" />
    
    <!-- Coordinate Dot Grid -->
    <rect width="850" height="310" fill="url(#hud-qnr8x3w-dotgrid)" />

    <!-- Ambient Scanlines -->
    <rect width="850" height="310" fill="url(#hud-qnr8x3w-scanlines)" />

    <!-- Top & Bottom Warning Telemetry Accent Bars -->
    <rect x="24" y="0" width="802" height="2" fill="#39ff14" opacity="0.6" />
    <rect x="24" y="308" width="802" height="2" fill="#39ff14" opacity="0.3" />
  </g>

  <!-- PANEL CHAMFERED BORDER -->
  <polygon points="
    0 24,
    24 0,
    826 0,
    850 24,
    850 286,
    826 310,
    24 310,
    0 286
  " fill="none" stroke="#39ff14" stroke-width="1.2" opacity="0.45" />

  <!-- CORNER TARGETING BRACKETS (Cybercore Signature) -->
  <!-- Top-Left -->
  <path d="M 0 38 L 0 24 L 24 0 L 38 0" fill="none" stroke="#39ff14" stroke-width="3" />
  <circle cx="24" cy="8" r="1.5" fill="#39ff14" />
  <!-- Top-Right -->
  <path d="M 812 0 L 826 0 L 850 24 L 850 38" fill="none" stroke="#39ff14" stroke-width="3" />
  <circle cx="826" cy="8" r="1.5" fill="#39ff14" />
  <!-- Bottom-Left -->
  <path d="M 0 272 L 0 286 L 24 310 L 38 310" fill="none" stroke="#39ff14" stroke-width="3" />
  <!-- Bottom-Right -->
  <path d="M 812 310 L 826 310 L 850 286 L 850 272" fill="none" stroke="#39ff14" stroke-width="3" />

  <!-- TOP HEADER HUD BAR -->
  <g transform="translate(36, 26)">
    <!-- Blinking Live Status Indicator -->
    <circle cx="4" cy="4" r="3.5" fill="#39ff14" class="hud-signal-pulse" />
    <text x="14" y="8" fill="#39ff14" font-size="10.5" font-weight="700" letter-spacing="0.1em">
      SYSTEM.SYS_ONLINE // SEC-GRID // 53.35°N, 33.85°E [SYS_ONLINE]
    </text>

    <!-- Clearance Badge Pill (Top-Right) -->
    <g transform="translate(540, -8)">
      <polygon points="0 0, 220 0, 230 24, 10 24" fill="rgba(255, 0, 85, 0.12)" stroke="#ff0055" stroke-width="1.2" />
      <text x="20" y="16" fill="#ff0055" font-size="10" font-weight="800" letter-spacing="0.14em">
        LVL-0 / BLACK-ICE
      </text>
    </g>
  </g>

  <!-- DIVIDER RULE WITH METRIC TICKS -->
  <line x1="36" y1="46" x2="814" y2="46" stroke="#39ff14" stroke-width="1" opacity="0.25" />
  <line x1="160" y1="42" x2="160" y2="50" stroke="#39ff14" stroke-width="1.5" />
  <line x1="380" y1="42" x2="380" y2="50" stroke="#39ff14" stroke-width="1.5" />
  <line x1="600" y1="42" x2="600" y2="50" stroke="#39ff14" stroke-width="1.5" />

  <!-- LEFT SECTION: RADAR APERTURE & OPERATOR IDENT -->
  <g transform="translate(36, 68)">
    <!-- Radar Reticle Rings -->
    <circle cx="50" cy="56" r="46" fill="none" stroke="#39ff14" stroke-width="1" stroke-dasharray="4 3" opacity="0.3" />
    <circle cx="50" cy="56" r="38" fill="none" stroke="#39ff14" stroke-width="0.7" opacity="0.4" />
    <circle cx="50" cy="56" r="50" fill="none" stroke="#39ff14" stroke-width="1.5" opacity="0.6" />

    <!-- Radar Crosshairs -->
    <line x1="0" y1="56" x2="100" y2="56" stroke="#39ff14" stroke-width="0.8" opacity="0.2" />
    <line x1="50" y1="6" x2="50" y2="106" stroke="#39ff14" stroke-width="0.8" opacity="0.2" />

    <!-- Avatar in Hexagonal Cutout -->
    <g transform="translate(0, 0)">
      <polygon points="50 12, 88 34, 88 78, 50 100, 12 78, 12 34" fill="none" stroke="#39ff14" stroke-width="2" />
      <g clip-path="url(#hud-qnr8x3w-hex-clip)">
        <image x="14" y="14" width="72" height="84" href="https://avatars.githubusercontent.com/u/157010181?v=4" preserveAspectRatio="xMidYMid slice" />
      </g>
    </g>

    <!-- Operator Identity Details -->
    <g transform="translate(116, 22)">
      <text x="0" y="0" fill="#227040" font-size="10" font-weight="600" letter-spacing="0.16em">
        OPERATOR ID
      </text>
      <text x="0" y="24" fill="#e6fffa" font-size="24" font-weight="800" letter-spacing="-0.02em">
        Neotic
      </text>
      <text x="0" y="44" fill="#39ff14" font-size="13" font-weight="600" letter-spacing="0.08em">
        @theneotic // ARCHITECT PRIME
      </text>
      <text x="0" y="66" fill="#227040" font-size="11" font-weight="400">
        Engineering high-craft digital systems &amp; cybernetic web...
      </text>
    </g>
  </g>

  <!-- VERTICAL HUD DIVIDER -->
  <line x1="475" y1="65" x2="475" y2="280" stroke="#39ff14" stroke-width="1" stroke-dasharray="2 3" opacity="0.3" />

  <!-- RIGHT SECTION: TELEMETRY MATRIX TILES -->
  <g transform="translate(495, 68)">
    
    <!-- MINI TELEMETRY HUD HEADER WITH SPARKLINE -->
    <g transform="translate(0, 0)">
      <text x="0" y="12" fill="#39ff14" font-size="10" font-weight="700" letter-spacing="0.14em">
        METRIC TELEMETRY FEED
      </text>

      <!-- Sparkline Signal Wave -->
      <g transform="translate(190, 0)">
        <polyline points="0,20 30,14 60,25 90,8 120,18 150,4 180,12 210,2" fill="none" stroke="#39ff14" stroke-width="1.8" />
        <circle cx="210" cy="2" r="3" fill="#00f0ff" class="hud-signal-pulse" />
      </g>
    </g>

    <!-- 6 MODULAR TELEMETRY CELLS -->
    <!-- ROW 1 -->
    <!-- Total Commits -->
    <g transform="translate(0, 30)">
      <rect width="98" height="54" fill="rgba(255,255,255,0.02)" stroke="#39ff14" stroke-width="0.8" />
      <rect x="0" y="0" width="3" height="54" fill="#39ff14" />
      <text x="12" y="20" class="hud-label">COMMITS</text>
      <text x="12" y="44" class="hud-val">5.2k</text>
    </g>

    <!-- Total Stars -->
    <g transform="translate(108, 30)">
      <rect width="98" height="54" fill="rgba(255,255,255,0.02)" stroke="#39ff14" stroke-width="0.8" />
      <rect x="0" y="0" width="3" height="54" fill="#ffaa00" />
      <text x="12" y="20" class="hud-label">STARS</text>
      <text x="12" y="44" class="hud-val">420</text>
    </g>

    <!-- Repositories -->
    <g transform="translate(216, 30)">
      <rect width="98" height="54" fill="rgba(255,255,255,0.02)" stroke="#39ff14" stroke-width="0.8" />
      <rect x="0" y="0" width="3" height="54" fill="#00f0ff" />
      <text x="12" y="20" class="hud-label">REPOS</text>
      <text x="12" y="44" class="hud-val">38</text>
    </g>

    <!-- ROW 2 -->
    <!-- Pull Requests -->
    <g transform="translate(0, 94)">
      <rect width="98" height="54" fill="rgba(255,255,255,0.02)" stroke="#39ff14" stroke-width="0.8" />
      <rect x="0" y="0" width="3" height="54" fill="#39ff14" />
      <text x="12" y="20" class="hud-label">PRs</text>
      <text x="12" y="44" class="hud-val">142</text>
    </g>

    <!-- Streak -->
    <g transform="translate(108, 94)">
      <rect width="98" height="54" fill="rgba(255,255,255,0.02)" stroke="#39ff14" stroke-width="0.8" />
      <rect x="0" y="0" width="3" height="54" fill="#39ff14" />
      <text x="12" y="20" class="hud-label">STREAK</text>
      <text x="12" y="44" class="hud-val">48d</text>
    </g>

    <!-- Clearance Score -->
    <g transform="translate(216, 94)">
      <rect width="98" height="54" fill="rgba(255,255,255,0.02)" stroke="#39ff14" stroke-width="0.8" />
      <rect x="0" y="0" width="3" height="54" fill="#ff0055" />
      <text x="12" y="20" class="hud-label">SCORE</text>
      <text x="12" y="44" class="hud-val">11.5k</text>
    </g>

    <!-- BOTTOM ROW: TOP LANGUAGE BARS -->
    <g transform="translate(0, 160)">
      <text x="0" y="10" fill="#227040" font-size="9" font-weight="700" letter-spacing="0.1em">
        PRIMARY STACK // TypeScript • Python • Rust
      </text>

      <!-- Segmented Language Bar -->
      <g transform="translate(0, 16)">
        <rect width="314" height="6" fill="#151922" rx="1" />
        <rect x="0" y="0" width="183" height="6" fill="#3178c6" rx="1" />
<rect x="185" y="0" width="69" height="6" fill="#3572a5" rx="1" />
<rect x="256" y="0" width="35" height="6" fill="#dea584" rx="1" />
<rect x="293" y="0" width="26" height="6" fill="#00add8" rx="1" />
      </g>
    </g>
  </g>

  <!-- BOTTOM FOOTER TELEMETRY -->
  <g transform="translate(36, 296)">
    <text x="0" y="0" fill="#227040" font-size="9" font-weight="600" letter-spacing="0.14em">
      PEAKER GIT-CARD // SECURE DATASTREAM // VER 1.0.0
    </text>
    <text x="778" y="0" text-anchor="end" fill="#39ff14" font-size="9" font-weight="700" letter-spacing="0.1em">
      CLEARANCE: CLASS-S [VERIFIED]
    </text>
  </g>
</svg>